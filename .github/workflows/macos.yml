name: macOS app

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v1.0.0); empty = build only"
        required: false
        default: ""

permissions:
  contents: write # a version tag publishes a release with the app attached

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14 # Apple Silicon
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: brew list ninja >/dev/null 2>&1 || brew install ninja

      - name: Cache JUCE and Catch2
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake --preset release -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: cmake --build --preset release --parallel

      - name: Test
        run: ctest --test-dir build/release --output-on-failure --parallel 4

      - name: Strict renders
        run: |
          for s in drone_basic ecosystem bloom_catch safety_panic; do
            ./build/release/tools/render/tidefield_render "scores/$s.json" -o "out/$s.wav" --strict > /dev/null
          done

      - name: Package
        run: |
          APP=$(find build/release -name "Tidefield.app" -type d -maxdepth 6 | head -1)
          test -n "$APP"
          # Ad-hoc signature with the hardened runtime and the audio-input entitlement
          # (not notarised: first launch needs right-click > Open).
          codesign --force --deep --options runtime --preserve-metadata=entitlements -s - "$APP"
          codesign --verify --deep --strict "$APP"
          # The shipped binary: Apple Silicon, macOS 12+, and it passes its own self-test.
          lipo -info "$APP/Contents/MacOS/Tidefield"
          vtool -show-build "$APP/Contents/MacOS/Tidefield" | grep -E "minos|platform"
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
          "$APP/Contents/MacOS/Tidefield" --self-test
          # The whole interface opens, shows every page and quits cleanly.
          "$APP/Contents/MacOS/Tidefield" --ui-test
          mkdir -p dist
          ditto -c -k --keepParent "$APP" dist/Tidefield-macOS-arm64.zip

      - name: Plugins (AU, VST3)
        run: |
          ART=build/release/src/app/TidefieldPlugin_artefacts/Release
          VST3="$ART/VST3/Tidefield.vst3"
          AU="$ART/AU/Tidefield.component"
          test -d "$VST3" && test -d "$AU"
          for P in "$VST3" "$AU"; do
            codesign --force --deep --options runtime -s - "$P"
            codesign --verify --deep --strict "$P"
            lipo -info "$(find "$P/Contents/MacOS" -type f | head -1)"
          done
          # Host each one the way a DAW does: play, odd block sizes, three sample
          # rates, state round-trip.
          CHECK=$(find build/release -name tidefield_plugincheck -type f -perm -u+x | head -1)
          "$CHECK" "$VST3"
          # Audio Units are found by registration: install it where hosts look, run
          # Apple's validator, then host it by its identifier.
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$AU" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -v aumu Tdfl Tdfd
          "$CHECK" "AudioUnit:Synths/aumu,Tdfl,Tdfd"
          # The app hosts other people's effects: scan, load, control, save and
          # reopen a small test effect.
          HOSTCHECK=$(find build/release -name tidefield_hostcheck -type f -perm -u+x | head -1)
          TESTFX=$(dirname "$(find build/release -name 'Tidefield Test Gain.vst3' -maxdepth 8 | head -1)")
          "$HOSTCHECK" "$TESTFX"
          mkdir -p dist/plugins
          cp -R "$VST3" "$AU" dist/plugins/
          cp resources/plugins-README.txt dist/plugins/README.txt
          (cd dist && ditto -c -k --keepParent plugins Tidefield-Plugins-macOS-arm64.zip)

      - uses: actions/upload-artifact@v4
        with:
          name: Tidefield-macOS-arm64
          path: |
            dist/Tidefield-macOS-arm64.zip
            dist/Tidefield-Plugins-macOS-arm64.zip
          retention-days: 30

      - name: Publish release (version tag, or a manual run with release_tag)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Tidefield ${{ inputs.release_tag || github.ref_name }}
          make_latest: true
          append_body: true
          files: |
            dist/Tidefield-macOS-arm64.zip
            dist/Tidefield-Plugins-macOS-arm64.zip
          generate_release_notes: true
          body: |
            Tidefield for macOS 12+ on Apple Silicon.

            Unzip, move Tidefield.app to Applications, then right-click it and choose Open the first time
            (the app is signed ad hoc, not notarised). If macOS still refuses: `xattr -cr /Applications/Tidefield.app`.

            Plugins: unzip Tidefield-Plugins, copy Tidefield.component to ~/Library/Audio/Plug-Ins/Components
            and Tidefield.vst3 to ~/Library/Audio/Plug-Ins/VST3, then rescan in your DAW (Logic, Live, Bitwig,
            Reaper...). If the DAW blocks them: `xattr -cr ~/Library/Audio/Plug-Ins/Components/Tidefield.component`.
